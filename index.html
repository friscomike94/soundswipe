function licenseLabel(x){const raw=String(x.license||x.source||'AUDIO'),low=raw.toLowerCase();if(low.includes('creativecommons.org/publicdomain/zero')||low==='cc0')return'CC0';if(low.includes('public domain')||['pd','citizendj','great78'].includes(String(x.source||'').toLowerCase()))return'PD';return esc(raw.length>18?raw.slice(0,18)+'…':raw);}
function pairCard(x,letter){return'<div class="abcard"><div class="abtop"><span class="letter">'+letter+'</span><span class="license">'+licenseLabel(x)+'</span></div><button class="play" data-play="'+esc(x.id)+'">▶</button>'+wave()+'<div class="abname">'+esc(x.title||'Untitled')+'</div><div class="abmeta">'+esc(itemMeta(x))+'</div></div>';}
function pairUI(pair,ns){if(!pair)return'<div class="empty"><b>평가할 A/B가 아직 없어요</b><p>같은 역할과 배치의 오디오 두 개가 들어오면 자동으로 페어가 만들어집니다.</p></div>';const done=Object.keys(state.pairChoices).filter(k=>k.startsWith('pair:'+ns+':')).length,total=PAIRS[ns].length;return'<div class="pair-context"><div class="row"><div><b>'+esc(FRIENDLY[pair.category]||pair.category||'Context pair')+'</b><small>'+(done+1)+' / '+total+' · 같은 그룹 안의 A/B</small></div><span class="lock">CONTEXT LOCK</span></div><div class="progress"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div></div><div class="abgrid">'+pairCard(pair.a,'A')+pairCard(pair.b,'B')+'</div><div class="question">어느 쪽을 다시 듣고 싶나요?</div><div class="votes"><button data-choice="a">A</button><button data-choice="b">B</button><button data-choice="neither">둘 다 아님</button></div><div class="hint">둘 다 아님을 누르면 ‘둘 다 좋음 / 둘 다 별로 / 차이 모름’을 한 번 더 구분합니다.</div>';
}
function filteredPairs(ns){let arr=PAIRS[ns]||[];const f=ns==='freesound'?state.freeFilter:state.sampleFilter;if(f&&f!=='all')arr=arr.filter(p=>p.category===f||p.a.category===f||p.b.category===f);return arr;}
function currentPair(ns){return filteredPairs(ns).find(p=>!state.pairChoices[p.id])||null;}
function categories(ns){return Array.from(new Set((PAIRS[ns]||[]).map(p=>p.category).filter(Boolean))).sort();}
function filterRail(ns){const f=ns==='freesound'?state.freeFilter:state.sampleFilter;return'<div class="rail"><button class="chip '+(f==='all'?'on':'')+'" data-filter="all">전체</button>'+categories(ns).map(c=>'<button class="chip '+(f===c?'on':'')+'" data-filter="'+esc(c)+'">'+esc(FRIENDLY[c]||c)+'</button>').join('')+'</div>';}
function resultsList(ns){const pairs=filteredPairs(ns).filter(p=>state.pairChoices[p.id]);if(!pairs.length)return'<div class="empty"><b>아직 결과가 없어요</b><p>A/B 평가를 시작하면 선택 기록이 여기에 쌓입니다.</p></div>';return'<div class="list">'+pairs.slice(-30).reverse().map(p=>{const ch=state.pairChoices[p.id],label={a:'A',b:'B',both_good:'둘 다 좋음',both_bad:'둘 다 별로',cannot_tell:'차이 모름'}[ch]||ch;return'<div class="item"><div class="item-main"><div class="item-title">'+esc(p.a.title)+' / '+esc(p.b.title)+'</div><div class="item-meta">'+esc(FRIENDLY[p.category]||p.category)+' · '+esc(p.source||'')+'</div></div><span class="result-choice '+esc(ch)+'">'+esc(label)+'</span></div>';}).join('')+'</div>';}
function bindPairView(root,ns){root.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const p=currentPair(ns);if(!p)return;const x=p.a.id===b.dataset.play?p.a:p.b;playItem(x);});root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const p=currentPair(ns);if(!p)return;if(b.dataset.choice==='neither'){activeSheet={ns,p};$('#sheetback').classList.add('on');}else savePairChoice(ns,p,b.dataset.choice);});root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{if(ns==='freesound')state.freeFilter=b.dataset.filter;else state.sampleFilter=b.dataset.filter;save();renderSource(ns);});}
async function savePairChoice(ns,pair,choice){state.pairChoices[pair.id]=choice;save();stopAudio();renderSource(ns);try{await fetch(SB_URL+'/rest/v1/ss_ratings',{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({sound_id:pair.id,title:(pair.a.title||'A')+' vs '+(pair.b.title||'B'),category:ns+'_pair',bpm:String(pair.a.bpm||pair.b.bpm||''),verdict:'pair_'+choice,tags:['choice:'+choice,'a:'+pair.a.id,'b:'+pair.b.id,'context:'+pair.category],roles:[ns+'_pair',pair.category],note:'',rating10:null,melody_judgment:'',dna_fit:choice,updated_at:new Date().toISOString()})});}catch(e){toast('로컬 저장됨 · 동기화 재시도 필요');}}
function renderSuno(){const el=$('#view-suno');const stemPairs=PAIRS.suno,sub=state.sunoSub;if(state.mainTab==='suno')$('#topTitle').textContent=sub==='compare'?'스템 비교':'곡 보관함';el.innerHTML='<div class="eyebrow">Suno Studio Discovery</div><h1 class="title">'+(sub==='compare'?'스템 비교':'곡 보관함')+'</h1><p class="subtitle">'+(sub==='compare'?'곡은 그대로 두고 한 역할만 A/B로 바꿔 듣습니다.':'현재 보유한 Suno 곡과 기존 평가를 확인합니다.')+'</p><div class="segments"><button class="seg '+(sub==='compare'?'on':'')+'" data-suno-sub="compare">스템 비교</button><button class="seg '+(sub==='library'?'on':'')+'" data-suno-sub="library">곡 보관함</button></div>'+(loadError?'<div class="error">'+esc(loadError)+'</div>':'')+(sub==='compare'?renderSunoCompare(stemPairs):renderSongLibrary());el.querySelectorAll('[data-suno-sub]').forEach(b=>b.onclick=()=>{state.sunoSub=b.dataset.sunoSub;save();renderSuno();});if(sub==='compare'){bindPairView(el,'suno');const go=el.querySelector('[data-go-library]');if(go)go.onclick=()=>{state.sunoSub='library';save();renderSuno();};}else bindSongLibrary(el);}
function renderSunoCompare(pairs){if(!pairs.length)return'<div class="panel"><div class="panel-head"><div><h3>Frozen Chassis 방식</h3><p>Studio에서 배경 스템을 고정하고 대상 역할 A/B만 교체한 스테레오 믹스를 등록합니다.</p></div><span class="tag">0 PAIRS</span></div><div class="statgrid"><div class="stat"><b>'+SONGS.length+'</b><span>보유 Suno 곡</span></div><div class="stat"><b>0</b><span>스템 A/B</span></div><div class="stat"><b>1</b><span>변경 역할</span></div></div></div><div class="empty"><b>아직 등록된 Suno 스템 페어가 없어요</b><p>실제 스템 A/B가 준비되기 전에는 가짜 결과를 표시하지 않습니다. 곡 보관함에서 기준 곡을 선택한 뒤 Studio에서 페어를 만들면 여기에 자동 노출되도록 설계되어 있습니다.</p><button class="primary" data-go-library>곡 보관함 열기</button></div>';return'<div class="panel"><div class="panel-head"><div><h3>Frozen Chassis</h3><p>비교 대상 외 모든 스템과 구간을 고정합니다.</p></div><span class="tag">'+pairs.length+' PAIRS</span></div></div>'+pairUI(currentPair('suno'),'suno');}
function renderSongLibrary(){if(!SONGS.length)return'<div class="empty"><b>불러온 Suno 곡이 없어요</b><p>Supabase의 기존 Suno 평가 행이 곡 보관함으로 들어옵니다.</p></div>';return'<div class="statgrid"><div class="stat"><b>'+SONGS.length+'</b><span>전체 곡</span></div><div class="stat"><b>'+SONGS.filter(s=>s.score>=8||s.release==='release').length+'</b><span>강한 후보</span></div><div class="stat"><b>'+SONGS.filter(s=>s.score).length+'</b><span>평가됨</span></div></div><div class="list">'+SONGS.map(s=>'<div class="item"><button class="item-play" data-song="'+esc(s.id)+'">▶</button><div class="item-main"><div class="item-title">'+esc(s.title)+'</div><div class="item-meta">'+esc([s.cluster,s.duration,s.model].filter(Boolean).join(' · '))+'</div></div><span class="item-score">'+(s.score?esc(s.score+'/10'):'—')+'</span><a class="item-link" href="'+esc(s.url)+'" target="_blank" rel="noopener">Suno</a></div>').join('')+'</div>';}
function bindSongLibrary(el){el.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>{const s=SONGS.find(x=>x.id===b.dataset.song);if(s)playItem({id:'song:'+s.id,cdn:'https://cdn1.suno.ai/'+s.id+'.mp3',seek:0,dur:0});});}
function renderSource(ns){const el=$('#view-'+ns),isFree=ns==='freesound',sub=isFree?state.freeSub:state.sampleSub,title=isFree?'Freesound':'Sample',eyebrow=isFree?'CC0 Sound DNA':'Public Domain Sample';if(state.mainTab===ns)$('#topTitle').textContent=title+(sub==='evaluate'?' 평가':' 결과');el.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h1 class="title">'+(sub==='evaluate'?title+' 평가':title+' 결과')+'</h1><p class="subtitle">'+(isFree?'CC0 원자 사운드와 역할 후보를 분리해 비교합니다.':'퍼블릭도메인 샘플을 실제 음악 문맥 기준으로 비교합니다.')+'</p><div class="segments"><button class="seg '+(sub==='evaluate'?'on':'')+'" data-sub="evaluate">평가</button><button class="seg '+(sub==='results'?'on':'')+'" data-sub="results">결과</button></div>'+filterRail(ns)+(sub==='evaluate'?pairUI(currentPair(ns),ns):resultsSummary(ns));el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{if(isFree)state.freeSub=b.dataset.sub;else state.sampleSub=b.dataset.sub;save();renderSource(ns);});bindPairView(el,ns);}
function resultsSummary(ns){const all=filteredPairs(ns),done=all.filter(p=>state.pairChoices[p.id]),a=done.filter(p=>state.pairChoices[p.id]==='a').length,b=done.filter(p=>state.pairChoices[p.id]==='b').length,none=done.length-a-b;return'<div class="statgrid"><div class="stat"><b>'+done.length+'</b><span>평가 페어</span></div><div class="stat"><b>'+Math.max(a,b)+'</b><span>명확한 선택</span></div><div class="stat"><b>'+none+'</b><span>둘 다 아님</span></div></div>'+resultsList(ns);}
function topSignals(){const score=new Map();SOUNDS.forEach(s=>{const r=Number(state.rating[s.id]||0);if(r<8)return;const k=s.instrument||s.role||FRIENDLY[s.category]||s.category;if(k)score.set(k,(score.get(k)||0)+r);});return Array.from(score.entries()).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);}
function renderResults(){const el=$('#view-results'),pairDone=Object.keys(state.pairChoices).length,rated=Object.values(state.rating).filter(x=>Number(x)>0).length,songRated=SONGS.filter(s=>s.score).length,signals=(Array.isArray(PROMPT.signals)&&PROMPT.signals.length?PROMPT.signals:topSignals()).filter(x=>x&&x!=='?');el.innerHTML='<div class="eyebrow">Compiled Taste State</div><h1 class="title">나의 음악 취향</h1><p class="subtitle">개별 점수보다 반복된 문맥 승리와 완성곡 증거를 우선합니다.</p><div class="statgrid"><div class="stat"><b>'+rated.toLocaleString()+'</b><span>개별 평가</span></div><div class="stat"><b>'+pairDone.toLocaleString()+'</b><span>문맥 A/B</span></div><div class="stat"><b>'+songRated+'</b><span>완성곡</span></div></div><div class="dna-hero"><div class="dna-ver">'+esc(PROMPT.version||'PERSONAL DNA')+' · '+esc(PROMPT.updated||'')+'</div><h2>Bass-led, dry, contextual</h2><p>베이스는 중심축으로, 다른 소리는 역할과 조합 안에서 판단합니다. 현재 프롬프트는 장르를 대신하는 최종 답이 아니라 검증된 개인 DNA 교정 레이어입니다.</p></div><div class="signal-title">현재 상위 신호</div><div class="signals">'+(signals.length?signals.map(x=>'<span class="signal">'+esc(x)+'</span>').join(''):'<span class="signal">평가 데이터 집계 중</span>')+'</div><div class="promptbox"><div class="prompthead"><b>STYLE OF MUSIC · DNA LAYER</b><button class="copy" data-copy="style">복사</button></div><p>'+esc(PROMPT.style)+'</p><div class="prompt-note">선택한 장르의 기본 문법 뒤에 이 교정 레이어를 적용합니다.</div></div><div class="promptbox exclude"><div class="prompthead"><b>EXCLUDE STYLES</b><button class="copy" data-copy="exclude">복사</button></div><p>'+esc(PROMPT.exclude)+'</p></div>';el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(PROMPT[b.dataset.copy]||''));}
function renderAll(){renderSuno();renderSource('freesound');renderSource('sample');renderResults();setTab(state.mainTab||'suno');updatePlayUI();}
function playItem(item){if(!item||!item.cdn)return;if(playingId===item.id&&!audio.paused){audio.pause();updatePlayUI();return;}playingId=item.id;playingItem=item;audio.src=item.cdn;audio.currentTime=Number(item.seek||0);audio.play().catch(()=>toast('재생을 시작하려면 다시 눌러주세요'));updatePlayUI();}
function stopAudio(){try{audio.pause()}catch(e){}playingId='';playingItem=null;updatePlayUI();}
function updatePlayUI(){$$('[data-play]').forEach(b=>{const on=b.dataset.play===playingId&&!audio.paused;b.classList.toggle('playing',on);b.textContent=on?'Ⅱ':'▶';});$$('[data-song]').forEach(b=>{const on=('song:'+b.dataset.song)===playingId&&!audio.paused;b.classList.toggle('playing',on);b.textContent=on?'Ⅱ':'▶';});}
audio.addEventListener('play',updatePlayUI);audio.addEventListener('pause',updatePlayUI);audio.addEventListener('timeupdate',()=>{if(playingItem&&Number(playingItem.dur||0)>0&&audio.currentTime>=Number(playingItem.seek||0)+Number(playingItem.dur)){audio.pause();audio.currentTime=Number(playingItem.seek||0);}});
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('복사됨');}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('복사됨');}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('on'),1500);}
$$('.nav').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#sheetback').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('on');};$$('[data-neither]').forEach(b=>b.onclick=()=>{if(!activeSheet)return;const x=activeSheet;activeSheet=null;$('#sheetback').classList.remove('on');savePairChoice(x.ns,x.p,b.dataset.neither);});
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
