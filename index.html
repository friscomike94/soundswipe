}
function secLabel(v){const n=Math.max(0,Math.round(Number(v)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function segKey(id,start,end){return'segment:'+id+':'+start+':'+end;}
function segmentsFor(x){const total=Math.max(1,Math.ceil(Number(x.dur||0))),out=[];for(let start=0;start<total;start+=12)out.push({start,end:Math.min(start+12,total)});return out;}
function selectedSegment(x){const segs=segmentsFor(x),wanted=Number(state.segmentDrafts[x.id]);return segs.find(s=>s.start===wanted)||segs.find(s=>!state.segmentReviews[segKey(x.id,s.start,s.end)])||segs[0];}
function contextPreview(x,s){const pad=3,seek=Math.max(0,s.start-pad),end=Math.min(Number(x.dur||s.end),s.end+pad);return{...x,id:'preview:'+segKey(x.id,s.start,s.end),seek,dur:end-seek};}
function miningCard(x,letter){const segs=segmentsFor(x),sel=selectedSegment(x),reviewed=segs.filter(s=>state.segmentReviews[segKey(x.id,s.start,s.end)]).length;return'<div class="abcard mining-card"><div class="abtop"><span class="letter">'+letter+'</span><span class="license">OWNER</span></div><button class="play" data-play="'+esc(x.id)+'">▶</button>'+wave()+'<div class="abname">'+esc(x.title||'Untitled')+'</div><div class="abmeta">'+esc([x.dur?secLabel(x.dur):'',x.bpm?x.bpm+' BPM':'','W'+(x.weirdness??''),'AI'+(x.audioInfluence??'')].filter(Boolean).join(' · '))+'</div><div class="mine-head"><b>12초씩 끝까지 듣기</b><span>'+reviewed+'/'+segs.length+'</span></div><div class="timeline">'+segs.map((s,i)=>{const r=state.segmentReviews[segKey(x.id,s.start,s.end)],cls=(sel.start===s.start?' on':'')+(r?' reviewed':'')+(r&&r.status==='saved'?' saved':'');return'<button class="segclip'+cls+'" data-segment="'+esc(x.id)+'" data-start="'+s.start+'" data-end="'+s.end+'">'+(i+1)+'<small>'+secLabel(s.start)+'–'+secLabel(s.end)+'</small></button>';}).join('')+'</div><div class="mine-actions"><button data-preview-segment="'+esc(x.id)+'">앞뒤 포함 듣기</button><button class="keep" data-save-segment="'+esc(x.id)+'">샘플로 저장</button><button class="skip" data-skip-segment="'+esc(x.id)+'">넘김</button></div></div>';}
function miningPairUI(pair){if(!pair)return'<div class="empty"><b>비공개 곡 채굴 페어가 없어요</b><p>실제 Suno 결과가 이 브라우저의 Private Producer Vault에 연결될 때만 표시됩니다. 오디오는 공개 저장소에 넣지 않습니다.</p></div>';const choice=state.pairChoices[pair.id]||'',labels={a:'A',b:'B',both_good:'둘 다 좋음',both_bad:'둘 다 별로',cannot_tell:'차이 모름'};return'<div class="pair-context"><div class="row"><div><b>'+esc(pair.title||'동일 조건 생성 2곡')+'</b><small>W'+esc(pair.weirdness??'')+' · AI'+esc(pair.audioInfluence??'')+' · 같은 샘플·프롬프트</small></div><span class="lock">OWNER TEST</span></div><div class="private-note">전체 곡 선택과 구간 보존은 별도 기록입니다. 12초 구간을 저장하거나 넘기면 끝까지 검토한 범위가 쌓입니다.</div></div><div class="mining-grid">'+miningCard(pair.a,'A')+miningCard(pair.b,'B')+'</div><div class="question">전체로는 어느 쪽을 다시 듣고 싶나요?'+(choice?' · 현재 '+esc(labels[choice]||choice):'')+'</div><div class="votes"><button class="'+(choice==='a'?'selected':'')+'" data-mining-choice="a">A</button><button class="'+(choice==='b'?'selected':'')+'" data-mining-choice="b">B</button><button class="'+(['both_good','both_bad','cannot_tell'].includes(choice)?'selected':'')+'" data-mining-choice="neither">둘 다 아님</button></div>';}
async function queueSunoWorkspaceMove(x,start,end){state.workspaceSync[x.id]={status:'pending',target:'sample',requestedAt:new Date().toISOString()};save();try{const r=await fetch(SB_URL+'/rest/v1/ss_ratings',{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({sound_id:'workspace:'+x.id,title:x.title||'Untitled',category:'suno_workspace_sync',bpm:String(x.bpm||''),verdict:'pending',tags:['parent_id:'+x.id,'source_workspace:bat-mining','target_workspace:sample','segment:'+start+'-'+end,'batch:'+(x.batch||'')],roles:['workspace_sync','bat-mining_to_sample'],note:'SoundSwipe sample save requested parent move to sample workspace',rating10:null,melody_judgment:'',dna_fit:'pending',updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('queue');state.workspaceSync[x.id]={...state.workspaceSync[x.id],status:'queued'};save();renderSource('sample');toast('샘플 저장됨 · sample 이동 예약됨');}catch(e){state.workspaceSync[x.id]={...state.workspaceSync[x.id],status:'local_pending'};save();renderSource('sample');toast('샘플 저장됨 · 이동 예약 재시도 필요');}}

function bindPairView(root,ns){root.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const p=currentPair(ns);if(!p)return;const x=p.a.id===b.dataset.play?p.a:p.b;playItem(x);});root.querySelectorAll('[data-save-sample]').forEach(b=>b.onclick=()=>{const x=SOUNDS.find(s=>String(s.id)===String(b.dataset.saveSample));if(x)toggleSavedSample(x,ns);});root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const p=currentPair(ns);if(!p)return;if(b.dataset.choice==='neither'){activeSheet={ns,p};$('#sheetback').classList.add('on');}else savePairChoice(ns,p,b.dataset.choice);});root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{if(ns==='freesound')state.freeFilter=b.dataset.filter;else state.sampleFilter=b.dataset.filter;save();renderSource(ns);});}
async function savePairChoice(ns,pair,choice){state.pairChoices[pair.id]=choice;save();stopAudio();if(ns==='suno'||ns==='suno_mining')renderSuno();else renderSource(ns);if(pair.private){toast('내 A/B 선택 저장됨');return;}try{await fetch(SB_URL+'/rest/v1/ss_ratings',{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({sound_id:pair.id,title:(pair.a.title||'A')+' vs '+(pair.b.title||'B'),category:ns+'_pair',bpm:String(pair.a.bpm||pair.b.bpm||''),verdict:'pair_'+choice,tags:['choice:'+choice,'a:'+pair.a.id,'b:'+pair.b.id,'context:'+pair.category],roles:[ns+'_pair',pair.category],note:'',rating10:null,melody_judgment:'',dna_fit:choice,updated_at:new Date().toISOString()})});}catch(e){toast('로컬 저장됨 · 동기화 재시도 필요');}}

function round01Score(){const score={P0:{tested:new Set(),positive:new Set()},P1:{tested:new Set(),positive:new Set()},P2:{tested:new Set(),positive:new Set()}};round01Pairs().forEach(p=>{const choice=state.round01Votes[p.id];if(!choice)return;for(const side of['a','b'])score[p[side].prompt_id].tested.add(p.slot);if(choice==='a'||choice==='both_good')score[p.a.prompt_id].positive.add(p.slot);if(choice==='b'||choice==='both_good')score[p.b.prompt_id].positive.add(p.slot);});return score;}

function renderRound01(){const pairs=round01Pairs(),done=pairs.filter(p=>state.round01Votes[p.id]).length,pair=currentRound01Pair();if(!pairs.length)return'<div class="empty"><b>Round-01 패널을 불러오지 못했어요</b><p>prompt_round01_panel.json 연결 상태를 확인해주세요.</p></div>';let body='';if(pair){body='<div class="round-card"><div class="round-card-head"><div><b>BLIND PROMPT TEST</b><span>프롬프트 이름은 선택 전에 숨깁니다.</span></div><span class="tag">'+(done+1)+' / '+pairs.length+'</span></div><div class="progress"><i style="width:'+Math.round(done/pairs.length*100)+'%"></i></div><div class="abgrid" style="margin-top:11px">'+round01AudioCard(pair.a,'A')+round01AudioCard(pair.b,'B')+'</div><div class="question">어느 쪽이 더 내 음악 같나요?</div><div class="votes"><button data-round-choice="a">A</button><button data-round-choice="b">B</button><button data-round-choice="neither">둘 다 아님</button></div><div class="hint">두 곡은 같은 소스에서 만들어졌고 Source Usage 블록만 다릅니다. 위치는 무작위입니다.</div></div>';}else body='<div class="round-card round-complete"><b>102개 블라인드 투표 완료</b><p>34개 소스와 204개 canonical 곡을 모두 한 번씩 사용했습니다. 아래 점수는 긍정한 고유 소스 ÷ 테스트한 고유 소스입니다.</p></div>';return'<div class="round-hero"><div class="panel-head"><div><h3>Round 01 · Source Usage</h3><p>34개 소스 · 204곡 · 102개 블라인드 카드. P0/P1/P2는 동일 노출로 비교합니다.</p></div><span class="tag">PUBLIC</span></div>'+round01ScoreUI()+'</div>'+body;}

function catalogSongItem(id){const s=(CATALOG.songs||[]).find(x=>String(x.id)===String(id));return s?{...s,dur:s.duration_seconds,category:'catalog_song',role:'finished_song',source:'Suno Catalog',license:s.rights_scope||'owner-private-reference',catalog:true}:null;}
function catalogPairItem(p){return p?{...p,a:catalogSongItem(p.song_a),b:catalogSongItem(p.song_b)}:null;}
function catalogScoreLedger(pairs){const map={};(CATALOG.songs||[]).forEach(s=>map[s.id]={id:s.id,score:1000,exposure:0,wins:0,losses:0,draws:0,positive:0,negative:0,unknown:0});for(const p of pairs||[]){const choice=state.catalogVotes[p.id];if(!choice||!map[p.song_a]||!map[p.song_b])continue;const a=map[p.song_a],b=map[p.song_b];a.exposure++;b.exposure++;if(choice==='cannot_tell'){a.unknown++;b.unknown++;continue;}let actual=.5;if(choice==='a')actual=1;else if(choice==='b')actual=0;if(choice==='a'){a.wins++;b.losses++;}else if(choice==='b'){b.wins++;a.losses++;}else{a.draws++;b.draws++;if(choice==='both_good'){a.positive++;b.positive++;}if(choice==='both_bad'){a.negative++;b.negative++;}}const expected=1/(1+Math.pow(10,(b.score-a.score)/400)),delta=24*(actual-expected);a.score+=delta;b.score-=delta;}return map;}
function catalogStage1Pairs(){return Array.isArray(CATALOG.stage1_pairs)?CATALOG.stage1_pairs:[];}
function catalogStage1Done(){const p=catalogStage1Pairs();return p.length>0&&p.every(x=>state.catalogVotes[x.id]);}
function catalogChampions(){if(!catalogStage1Done())return[];const ledger=catalogScoreLedger(catalogStage1Pairs());return(CATALOG.lineages||[]).map(l=>l.song_ids.slice().sort((a,b)=>(ledger[b]?.score||1000)-(ledger[a]?.score||1000)||String(a).localeCompare(String(b)))[0]).filter(Boolean);}
function catalogSeed(s){let h=2166136261>>>0;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function catalogShuffle(arr,seed){const a=arr.slice();let x=seed||1;for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function catalogStage2Pairs(){const champs=catalogChampions();if(!champs.length)return[];const songs=Object.fromEntries((CATALOG.songs||[]).map(s=>[s.id,s])),buckets={},seedPairs=[],leftovers=[],out=[],side={};for(const id of champs){const k=songs[id]?.lane_key||'other';(buckets[k]??=[]).push(id);side[id]={a:0,b:0};}for(const[k,ids]of Object.entries(buckets).sort()){const pool=catalogShuffle(ids,catalogSeed('CAT-S2-lane-'+k));while(pool.length>1)seedPairs.push([pool.shift(),pool.shift(),'within_lane']);if(pool.length)leftovers.push(pool[0]);}const extra=catalogShuffle(leftovers,catalogSeed('CAT-S2-bridges'));while(extra.length>1)seedPairs.push([extra.shift(),extra.shift(),'lane_bridge']);if(extra.length)seedPairs.push([extra.shift(),'__bye__','bye']);while(seedPairs.length<Math.ceil((champs.length+1)/2))seedPairs.push(['__bye__','__bye__','bye']);let ring=seedPairs.map(p=>p[0]).concat(seedPairs.map(p=>p[1]).reverse());for(let round=0;round<4;round++){for(let i=0;i<ring.length/2;i++){const x=ring[i],y=ring[ring.length-1-i];if(x==='__bye__'||y==='__bye__')continue;const xa=side[x].a,xb=side[x].b,ya=side[y].a,yb=side[y].b,costXY=Math.abs(xa+1-xb)+Math.abs(ya-(yb+1)),costYX=Math.abs(xa-(xb+1))+Math.abs(ya+1-yb),flip=costYX<costXY||costYX===costXY&&catalogSeed('CAT-S2-side-'+round+'-'+x+'-'+y)%2===1,a=flip?y:x,b=flip?x:y;side[a].a++;side[b].b++;out.push({id:'CAT-S2-R'+(round+1)+'-'+String(out.length+1).padStart(3,'0'),stage:2,lineage_id:round===0?seedPairs[i]?.[2]||'lane_aware':'swiss_round',song_a:a,song_b:b});}ring=[ring[0],ring[ring.length-1],...ring.slice(1,-1)];}return out;}

function renderSource(ns){const el=$('#view-'+ns),isFree=ns==='freesound',sub=isFree?state.freeSub:state.sampleSub,title=isFree?'Freesound':'Sample',eyebrow=isFree?'CC0 Sound DNA':sub==='saved'?'Private Sample Vault':'Public Domain Sample',screenTitle=sub==='saved'?'저장한 샘플':sub==='evaluate'?title+' 평가':title+' 결과';if(state.mainTab===ns)$('#topTitle').textContent=title+(sub==='saved'?' 저장함':sub==='evaluate'?' 평가':' 결과');const savedTab=isFree?'':'<button class="seg '+(sub==='saved'?'on':'')+'" data-sub="saved">저장함</button>';const body=sub==='saved'?savedSamplesList():sub==='evaluate'?pairUI(currentPair(ns),ns):resultsSummary(ns);el.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h1 class="title">'+screenTitle+'</h1><p class="subtitle">'+(sub==='saved'?'A/B 카드에서 저장한 소리를 다시 듣고 샘플 후보로 관리합니다.':isFree?'CC0 원자 사운드와 역할 후보를 분리해 비교합니다.':'퍼블릭도메인 샘플을 실제 음악 문맥 기준으로 비교합니다.')+'</p><div class="segments"><button class="seg '+(sub==='evaluate'?'on':'')+'" data-sub="evaluate">평가</button><button class="seg '+(sub==='results'?'on':'')+'" data-sub="results">결과</button>'+savedTab+'</div>'+(sub==='saved'?'':filterRail(ns))+body;el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{if(isFree)state.freeSub=b.dataset.sub;else state.sampleSub=b.dataset.sub;save();renderSource(ns);});if(sub==='saved')bindSavedSamples(el);else bindPairView(el,ns);}
function resultsSummary(ns){const all=filteredPairs(ns),done=all.filter(p=>state.pairChoices[p.id]),a=done.filter(p=>state.pairChoices[p.id]==='a').length,b=done.filter(p=>state.pairChoices[p.id]==='b').length,none=done.length-a-b;return'<div class="statgrid"><div class="stat"><b>'+done.length+'</b><span>평가 페어</span></div><div class="stat"><b>'+Math.max(a,b)+'</b><span>명확한 선택</span></div><div class="stat"><b>'+none+'</b><span>둘 다 아님</span></div></div>'+resultsList(ns);}
function savedSamplesList(){const items=Object.keys(state.savedSamples).map(id=>SOUNDS.find(s=>String(s.id)===String(id))||round01SongItem(id)||catalogSongItem(id)).filter(Boolean),segments=Object.entries(state.segmentReviews).filter(([,v])=>v&&v.status==='saved');if(!items.length&&!segments.length)return'<div class="empty"><b>저장한 샘플이 없어요</b><p>A/B 카드나 곡 채굴에서 ‘샘플로 저장’을 누르면 여기에 모입니다.</p></div>';return'<div class="panel"><div class="panel-head"><div><h3>Private Sample Vault</h3><p>저장한 소리는 원본 정보와 권리 상태를 유지합니다.</p></div><span class="tag">'+(items.length+segments.length)+' SAVED</span></div></div><div class="list">'+segments.slice().reverse().map(([key,v])=>'<div class="item"><button class="item-play" data-saved-segment-play="'+esc(key)+'">▶</button><div class="item-main"><div class="item-title">'+esc(v.title||'Untitled')+' · '+secLabel(v.start)+'–'+secLabel(v.end)+'</div><div class="item-meta">Suno 곡 채굴 · '+esc(v.sourceStemId||'source lineage')+' · W'+esc(v.weirdness??'')+' · AI'+esc(v.audioInfluence??'')+' · sample 이동 '+esc(state.workspaceSync[v.parentId]?.status||'대기')+'</div></div><span class="license">OWNER</span><button class="sample-remove" data-remove-segment="'+esc(key)+'">삭제</button></div>').join('')+items.slice().reverse().map(x=>'<div class="item"><button class="item-play" data-saved-play="'+esc(x.id)+'">▶</button><div class="item-main"><div class="item-title">'+esc(x.title||'Untitled')+'</div><div class="item-meta">'+esc(itemMeta(x))+'</div></div><span class="license">'+licenseLabel(x)+'</span><button class="sample-remove" data-remove-sample="'+esc(x.id)+'">삭제</button></div>').join('')+'</div>';}
function bindSavedSamples(el){el.querySelectorAll('[data-saved-play]').forEach(b=>b.onclick=()=>{const x=SOUNDS.find(s=>String(s.id)===String(b.dataset.savedPlay))||round01SongItem(b.dataset.savedPlay)||catalogSongItem(b.dataset.savedPlay);if(x)playItem(x);});el.querySelectorAll('[data-remove-sample]').forEach(b=>b.onclick=()=>{const x=SOUNDS.find(s=>String(s.id)===String(b.dataset.removeSample))||round01SongItem(b.dataset.removeSample)||catalogSongItem(b.dataset.removeSample);if(x){if(x.catalog)toggleCatalogSaved(x);else toggleSavedSample(x,x.round01?'round01':'sample');}});el.querySelectorAll('[data-saved-segment-play]').forEach(b=>b.onclick=()=>{const v=state.segmentReviews[b.dataset.savedSegmentPlay],x=v&&privateMiningItem(v.parentId);if(x)playItem({...x,id:'saved:'+b.dataset.savedSegmentPlay,seek:v.start,dur:v.end-v.start});});el.querySelectorAll('[data-remove-segment]').forEach(b=>b.onclick=()=>{delete state.segmentReviews[b.dataset.removeSegment];save();renderSource('sample');toast('비공개 샘플 구간 삭제됨');});}
function topSignals(){const score=new Map();SOUNDS.forEach(s=>{const r=Number(state.rating[s.id]||0);if(r<8)return;const k=s.instrument||s.role||FRIENDLY[s.category]||s.category;if(k)score.set(k,(score.get(k)||0)+r);});return Array.from(score.entries()).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);}
function techAudioCard(test,side){const x=test[side],id='tech:'+test.id+':'+side;return'<div class="abcard"><div class="abtop"><span class="letter">'+side.toUpperCase()+'</span><span class="license">ORIGINAL</span></div><button class="play" data-tech-play="'+side+'" data-play="'+esc(id)+'">▶</button>'+wave()+'<div class="tech-audio-name">블라인드 '+side.toUpperCase()+'</div><div class="tech-audio-meta">'+esc(test.duration_seconds+'초 · '+test.tier.toUpperCase()+' · -23 dBFS')+'</div></div>';}
function renderTechniqueLab(){const items=Array.isArray(TECHNIQUES.techniques)?TECHNIQUES.techniques:[],tests=Array.isArray(TECHNIQUES.tests)?TECHNIQUES.tests:[],mvp=items.filter(x=>x.mvp),families=Array.isArray(TECHNIQUES.family_order)?TECHNIQUES.family_order:DEFAULT_TECHNIQUES.family_order,done=Object.keys(state.techniqueChoices||{}).filter(id=>tests.some(t=>t.id===id)).length;const familyCards=families.map(f=>{const total=items.filter(x=>x.family===f).length,planned=mvp.filter(x=>x.family===f).length;return'<div class="tech-family"><b>'+esc(TECH_FRIENDLY[f]||f)+'</b><span>'+total+'개 수집 · '+planned+'개 1차 설계</span><i style="width:'+(total?Math.round(planned/total*100):0)+'%"></i></div>';}).join('');let player='';if(tests.length){const ix=Math.max(0,Math.min(tests.length-1,Number(state.techniqueIndex)||0)),test=tests[ix],choice=state.techniqueChoices[test.id]||'',tech=items.find(x=>x.id===test.technique_id)||{},techLetter=String(test.technique_side||'b').toUpperCase(),controlLetter=techLetter==='A'?'B':'A',choices=[['a','A'],['b','B'],['both_good','둘 다 좋음'],['both_bad','둘 다 별로'],['cannot_tell','차이를 모르겠음']];player='<div class="tech-test"><div class="tech-test-head"><div><b>BLIND TEST '+String(ix+1).padStart(2,'0')+'</b><span>'+esc(test.question_ko||'어느 쪽이 더 내 음악 같나요?')+'</span></div><span class="tag">'+(ix+1)+' / '+tests.length+'</span></div><div class="progress"><i style="width:'+Math.round((ix+1)/tests.length*100)+'%"></i></div><div class="abgrid">'+techAudioCard(test,'a')+techAudioCard(test,'b')+'</div><div class="tech-votes">'+choices.map(c=>'<button class="'+(choice===c[0]?'on':'')+'" data-tech-choice="'+c[0]+'">'+c[1]+'</button>').join('')+'</div>'+(choice?'<div class="tech-reveal"><div class="eyebrow">VOTE LOCKED · REVEAL</div><h3>'+esc(tech.title_ko||test.technique_id)+' <small>('+esc(tech.canonical_name||'')+')</small></h3><p>'+esc(tech.listener_effect_ko||'')+'</p><p><b>'+techLetter+'</b>가 기법 적용, <b>'+controlLetter+'</b>가 통제 조건입니다. '+esc(test[ String(test.technique_side||'b') ].description||'')+'</p><div class="tech-clause">'+esc(tech.suno_prompt_clause||'')+'</div><p>현재 오디오는 SoundSwipe 원본 합성으로 정확히 렌더했습니다. Suno 프롬프트 구현 성공률은 아직 별도 미검증입니다.</p><button class="tech-next" data-tech-next>'+((ix+1)<tests.length?'다음 블라인드 테스트':'결과에서 보기')+'</button></div>':'')+'</div>'; }else player='<div class="tech-empty"><b>아직 실제 기법 A/B 오디오는 없어요</b><p>검증된 오디오가 생성되기 전에는 가짜 선택지나 결과를 표시하지 않습니다.</p></div>';return'<div class="panel"><div class="panel-head"><div><h3>Technique Lab · Blind First</h3><p>기법명과 전문용어는 투표 뒤에만 공개합니다. 한 번에 하나의 작곡 변수만 바꿉니다.</p></div><span class="tag">'+tests.length+' AUDIO PAIRS</span></div><div class="tech-summary"><div class="tech-metric"><b>'+items.length+'</b><span>정리된 기법</span></div><div class="tech-metric"><b>'+tests.length+'</b><span>실제 A/B 오디오</span></div><div class="tech-metric"><b>'+done+'/'+tests.length+'</b><span>완료한 A/B</span></div></div></div>'+player+'<div class="tech-family-grid">'+familyCards+'</div><div class="panel"><div class="panel-head"><div><h3>검증 규칙</h3><p>기법 점수 = 긍정한 고유 소스 ÷ 테스트한 고유 소스. 현재 3쌍은 원본 합성 1차 프로토타입이며 Suno 구현률 증거와 분리합니다.</p></div><span class="tag">1 VARIABLE</span></div><div class="tech-source">오디오 권리: SoundSwipe 원본 합성, public-safe. 이론 출처: <a href="https://viva.pressbooks.pub/openmusictheory/" target="_blank" rel="noopener">Open Music Theory</a> (CC BY-SA 4.0), <a href="https://musictheory.pugetsound.edu/mt21c/" target="_blank" rel="noopener">MT21C</a> (GNU FDL 1.2+).</div></div>';}
function bindTechniqueLab(root){const tests=Array.isArray(TECHNIQUES.tests)?TECHNIQUES.tests:[],ix=Math.max(0,Math.min(tests.length-1,Number(state.techniqueIndex)||0)),test=tests[ix];if(!test)return;root.querySelectorAll('[data-tech-play]').forEach(b=>b.onclick=()=>{const side=b.dataset.techPlay,x=test[side];playItem({id:'tech:'+test.id+':'+side,title:'Blind '+side.toUpperCase(),cdn:x.audio,dur:test.duration_seconds,license:test.rights});});root.querySelectorAll('[data-tech-choice]').forEach(b=>b.onclick=async()=>{const choice=b.dataset.techChoice;state.techniqueChoices[test.id]=choice;save();renderSuno();toast('선택 저장됨 · 동기화 중');try{await writeTechniqueChoice(test,choice);toast('Supabase 동기화 완료');}catch(e){toast('폰에 저장됨 · 서버 재시도 필요');}});const next=root.querySelector('[data-tech-next]');if(next)next.onclick=()=>{if(ix+1<tests.length){state.techniqueIndex=ix+1;save();renderSuno();}else setTab('results');};}

function renderTechniqueDNA(){const evidence=Array.isArray(TECHNIQUES.evidence)?TECHNIQUES.evidence:[],tests=Array.isArray(TECHNIQUES.tests)?TECHNIQUES.tests:[],items=Array.isArray(TECHNIQUES.techniques)?TECHNIQUES.techniques:[],strong=evidence.filter(x=>x.promotion_status==='validated'),local=tests.filter(t=>state.techniqueChoices&&state.techniqueChoices[t.id]),uncertain=evidence.filter(x=>x.promotion_status!=='validated'),tested=new Set([...evidence.map(x=>x.technique_id),...local.map(x=>x.technique_id)].filter(Boolean)).size,localNames=local.map(t=>{const x=items.find(i=>i.id===t.technique_id);return x?x.title_ko:t.technique_id;});return'<div class="tech-dna"><div class="tech-dna-head"><div><h3>작곡기법 DNA</h3><p>이름이 아니라 반복된 블라인드 선택과 실제 구현 여부로만 올라옵니다.</p></div><span class="tag">'+tested+' TESTED</span></div><div class="tech-dna-grid"><div class="tech-dna-col strong"><b>강한 신호 · '+strong.length+'</b><p>'+(strong.length?strong.map(x=>esc(x.title_ko||x.technique_id)).join(' · '):'한 소스만으로는 강한 신호로 승격하지 않습니다.')+'</p></div><div class="tech-dna-col"><b>아직 불확실 · '+(uncertain.length+local.length)+'</b><p>'+((uncertain.length||local.length)?[...uncertain.map(x=>x.title_ko||x.technique_id),...localNames].map(esc).join(' · '):'블라인드 A/B를 완료하면 여기에 누적됩니다.')+'</p></div></div></div>';}
function renderResults(){const el=$('#view-results'),pairDone=Object.keys(state.pairChoices).length,rated=Object.values(state.rating).filter(x=>Number(x)>0).length,songRated=SONGS.filter(s=>s.score).length,signals=(Array.isArray(PROMPT.signals)&&PROMPT.signals.length?PROMPT.signals:topSignals()).filter(x=>x&&x!=='?');el.innerHTML='<div class="eyebrow">Compiled Taste State</div><h1 class="title">나의 음악 취향</h1><p class="subtitle">개별 점수보다 반복된 문맥 승리와 완성곡 증거를 우선합니다.</p><div class="statgrid"><div class="stat"><b>'+rated.toLocaleString()+'</b><span>개별 평가</span></div><div class="stat"><b>'+pairDone.toLocaleString()+'</b><span>문맥 A/B</span></div><div class="stat"><b>'+songRated+'</b><span>완성곡</span></div></div><div class="dna-hero"><div class="dna-ver">'+esc(PROMPT.version||'PERSONAL DNA')+' · '+esc(PROMPT.updated||'')+'</div><h2>Bass-led, dry, contextual</h2><p>베이스는 중심축으로, 다른 소리는 역할과 조합 안에서 판단합니다. 현재 프롬프트는 장르를 대신하는 최종 답이 아니라 검증된 개인 DNA 교정 레이어입니다.</p></div><div class="signal-title">현재 상위 신호</div><div class="signals">'+(signals.length?signals.map(x=>'<span class="signal">'+esc(x)+'</span>').join(''):'<span class="signal">평가 데이터 집계 중</span>')+'</div>'+renderTechniqueDNA()+'<div class="promptbox"><div class="prompthead"><b>STYLE OF MUSIC · DNA LAYER</b><button class="copy" data-copy="style">복사</button></div><p>'+esc(PROMPT.style)+'</p><div class="prompt-note">선택한 장르의 기본 문법 뒤에 이 교정 레이어를 적용합니다.</div></div><div class="promptbox exclude"><div class="prompthead"><b>EXCLUDE STYLES</b><button class="copy" data-copy="exclude">복사</button></div><p>'+esc(PROMPT.exclude)+'</p></div>';el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(PROMPT[b.dataset.copy]||''));}
function renderAll(){renderSuno();renderSource('freesound');renderSource('sample');renderResults();setTab(state.mainTab||'suno');updatePlayUI();}
function playItem(item){if(!item||!item.cdn)return;if(playingId===item.id&&!audio.paused){audio.pause();updatePlayUI();return;}playingId=item.id;playingItem=item;audio.src=item.cdn;audio.currentTime=Number(item.seek||0);audio.play().catch(()=>toast('재생을 시작하려면 다시 눌러주세요'));updatePlayUI();}
function stopAudio(){try{audio.pause()}catch(e){}playingId='';playingItem=null;updatePlayUI();}
function updatePlayUI(){$$('[data-play]').forEach(b=>{const on=b.dataset.play===playingId&&!audio.paused;b.classList.toggle('playing',on);b.textContent=on?'Ⅱ':'▶';});$$('[data-saved-play]').forEach(b=>{const on=b.dataset.savedPlay===playingId&&!audio.paused;b.classList.toggle('playing',on);b.textContent=on?'Ⅱ':'▶';});$$('[data-song]').forEach(b=>{const on=('song:'+b.dataset.song)===playingId&&!audio.paused;b.classList.toggle('playing',on);b.textContent=on?'Ⅱ':'▶';});}
audio.addEventListener('play',updatePlayUI);audio.addEventListener('pause',updatePlayUI);audio.addEventListener('timeupdate',()=>{if(playingItem&&Number(playingItem.dur||0)>0&&audio.currentTime>=Number(playingItem.seek||0)+Number(playingItem.dur)){audio.pause();audio.currentTime=Number(playingItem.seek||0);}});
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('복사됨');}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('복사됨');}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('on'),1500);}
$$('.nav').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#sheetback').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('on');};$$('[data-neither]').forEach(b=>b.onclick=()=>{if(!activeSheet)return;const x=activeSheet;activeSheet=null;$('#sheetback').classList.remove('on');if(x.kind==='round01')saveRound01Choice(x.p,b.dataset.neither);else if(x.kind==='catalog')saveCatalogChoice(x.p,b.dataset.neither);else savePairChoice(x.ns,x.p,b.dataset.neither);});
fetch('prompt_round01_panel.json?warm='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{if(x){ROUND01=x;if(!CATALOG_ENABLED){state.sunoSub='round01';state.mainTab='suno';}renderAll();}}).catch(()=>{});
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
